<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ECharts editor</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <strong id="file">Blank canvas</strong>
        <button id="openFile" class="btn tiny" title="Open a project file, or insert the current canvas into one">Open…</button>
        <select id="fencePicker" class="fence-picker" title="Pick the ```echarts fence to edit" hidden></select>
        <span id="status" class="status">Loading…</span>
        <span id="sizeNote" class="size-note">—</span>
      </div>
      <div class="actions">
        <button id="undo" class="btn icon" title="Undo ⌘Z">↶</button>
        <button id="redo" class="btn icon" title="Redo ⇧⌘Z">↷</button>
        <label class="chk"><input type="checkbox" id="blogMode" checked /> Render as blog</label>
        <label class="chk"><input type="checkbox" id="darkMode" /> Dark</label>
        <span class="sep"></span>
        <label class="chk"><input type="checkbox" id="grid" /> Grid</label>
        <label class="chk"><input type="checkbox" id="snap" /> Snap</label>
        <label class="chk"><input type="checkbox" id="autoSync"/> Auto-sync</label>
        <button id="save" class="btn primary">Save ⌘S</button>
      </div>
    </header>

    <main>
      <section class="canvas-wrap">
        <div id="stage" class="stage" data-mode="light">
          <div id="chart"></div>
          <div id="marquee" class="marquee"></div>
        </div>

        <div id="selbar" class="selbar" hidden>
          <span class="sel-count"><b id="selCount">0</b> selected</span>
          <span class="sep"></span>
          <button class="btn tiny" data-act="align-y" title="Line the selected nodes up on one horizontal line (same Y)">Align level</button>
          <button class="btn tiny" data-act="align-x" title="Line the selected nodes up on one vertical line (same X)">Align upright</button>
          <button class="btn tiny" data-act="dist-x" title="Even spacing along X (needs 3 or more)">Distribute across</button>
          <button class="btn tiny" data-act="dist-y" title="Even spacing along Y (needs 3 or more)">Distribute down</button>
          <span class="sep"></span>
          <input type="color" id="selColor" class="mini-color" title="Set the colour for all selected nodes" />
          <select id="selPos" class="mini-select" title="Set the label position for all selected nodes">
            <option value="">Position…</option>
            <option value="left">left</option>
            <option value="right">right</option>
            <option value="top">top</option>
            <option value="bottom">bottom</option>
            <option value="inside">inside</option>
          </select>
          <span class="sep"></span>
          <button class="btn tiny danger" data-act="delete">Delete</button>
          <button class="btn tiny" data-act="clear">Clear selection</button>
        </div>

        <p class="hint">
          Drag on empty space to marquee-select · drag a selected point to move the whole group ·
          arrow keys nudge · use “Open…” to switch files or insert this canvas into an article
        </p>
      </section>

      <aside class="panel">
        <div class="panel-head">
          <span>Nodes <b id="count">0</b></span>
          <button id="add" class="btn">+ Add</button>
        </div>
        <div id="nodes" class="nodes"></div>
      </aside>
    </main>

    <div class="modal" id="fileModal" hidden>
      <div class="modal-box">
        <div class="modal-head">
          <span>Open a file / create a chart</span>
          <button class="modal-close" id="modalClose" title="Close">×</button>
        </div>

        <div class="modal-tools">
          <input id="fileSearch" class="modal-search" type="text" placeholder="Search for a file path…" spellcheck="false" />
          <label class="chk"><input type="checkbox" id="onlyCharts" /> Charts only</label>
        </div>
        <div id="fileList" class="file-list"></div>

        <div class="modal-foot">
          <button id="modalOpen" class="btn primary" disabled>Open</button>
          <span class="sep"></span>
          <select id="anchorSel" class="mini-select" disabled>
            <option value="">Insert at…</option>
          </select>
          <button id="modalInsert" class="btn" disabled title="Insert the current canvas as a new ```echarts fence">Insert current chart</button>
        </div>
      </div>
    </div>

    <script src="/vendor/echarts.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
